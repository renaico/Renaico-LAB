apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner
  namespace: ansible
  labels:
    app: ansible-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner
  template:
    metadata:
      labels:
        app: ansible-runner
    spec:
      # fsGroup asigna el grupo 1000 (ansible) a todos los volúmenes montados automáticamente
      securityContext:
        fsGroup: 1000
      containers:
      - name: ansible
        image: ubuntu:22.04
        env:
        - name: DEBIAN_FRONTEND
          value: noninteractive
        - name: LANG
          value: en_US.UTF-8
        - name: LC_ALL
          value: en_US.UTF-8
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=== Actualizando repositorios e instalando paquetes básicos ==="
          apt-get update
          apt-get install -y --no-install-recommends \
            openssh-server \
            sudo \
            python3 \
            python3-pip \
            python3-argcomplete \
            curl \
            wget \
            git \
            vim \
            iputils-ping \
            net-tools \
            rsync \
            locales \
            ca-certificates

          echo "=== Configurando Locales ==="
          sed -i 's/# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen
          echo "LANG=en_US.UTF-8" > /etc/default/locale

          echo "=== Instalando Ansible y dependencias para Windows (WinRM) ==="
          pip3 install --upgrade pip
          pip3 install ansible pywinrm requests-ntlm

          echo "=== Configurando Servidor SSH ==="
          mkdir -p /var/run/sshd
          ssh-keygen -A

          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config

          echo "=== Creando usuario ansible ==="
          if ! id ansible >/dev/null 2>&1; then
            useradd -u 1000 -m -d /home/ansible -s /bin/bash ansible
            echo "ansible:ansible123" | chpasswd
            echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible
            chmod 0440 /etc/sudoers.d/ansible
          fi

          echo "=== Configurando claves SSH ==="
          mkdir -p /home/ansible/.ssh
          
          cat > /home/ansible/.ssh/authorized_keys << 'KEY'
          ssh-rsa  renaico@INFRMBM1
          KEY

          chown -R 1000:1000 /home/ansible
          chmod 700 /home/ansible/.ssh
          chmod 600 /home/ansible/.ssh/authorized_keys

          echo "=== Creando directorio en el PVC ==="
          mkdir -p /ansible-data/projects
          chmod -R 777 /ansible-data || true

          echo "=== Iniciando Servicio SSH ==="
          exec /usr/sbin/sshd -D -e
        workingDir: /ansible-data
        ports:
        - containerPort: 22
          name: ssh
        volumeMounts:
        - mountPath: /ansible-data
          name: ansible-storage
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 40
          periodSeconds: 20
        startupProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30 
        readinessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: ansible-storage
        persistentVolumeClaim:
          claimName: ansible-data